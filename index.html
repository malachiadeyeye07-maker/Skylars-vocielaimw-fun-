
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8e8ed">
<title>A Little Piece of Me</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  background: #f8e8ed;
  color: #49343d;
  transition: background .4s ease;
}

body[data-mood="stress"] { background: #f5dfe4; }
body[data-mood="anxiety"] { background: #dceaf5; }
body[data-mood="miss"] { background: #f5edda; }
body[data-mood="cheer"] { background: #e1eddf; }
body[data-mood="flirty"] { background: #eae1f5; }

main {
  width: min(100% - 32px, 480px);
  margin: auto;
  padding: 45px 0;
}

header, .panel {
  text-align: center;
}

h1 {
  font-size: 2.25rem;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 1.08rem;
  line-height: 1.6;
  margin: 0 auto 25px;
}

.panel {
  background: rgba(255,255,255,.7);
  padding: 28px 22px;
  border-radius: 24px;
  box-shadow: 0 8px 28px rgba(80,45,60,.08);
}

h2 {
  font-size: 1.8rem;
  margin: 0 0 18px;
}

audio {
  width: 100%;
  margin: 10px 0 20px;
}

.message {
  font-size: 1.12rem;
  line-height: 1.8;
  margin: 12px 0 0;
}

.buttons {
  display: grid;
  gap: 12px;
  margin-top: 24px;
}

button {
  border: 0;
  border-radius: 18px;
  padding: 17px;
  font-family: inherit;
  font-size: 1.05rem;
  color: #49343d;
  background: rgba(255,255,255,.8);
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(80,45,60,.06);
}

button:active { transform: scale(.98); }

.back {
  display: inline-block;
  margin-bottom: 22px;
  background: rgba(255,255,255,.65);
  padding: 12px 18px;
}

.hidden { display: none; }

footer {
  text-align: center;
  font-size: .9rem;
  margin-top: 28px;
  opacity: .7;
}
</style>
</head>

<body data-mood="home">
<main>

<section id="home">
  <header>
    <h1>A Little Piece of Me</h1>
    <p class="subtitle">I may not always be there with you, but have a listen.</p>
  </header>

  <div class="panel">
    <h2>A little message for you ❤️</h2>
    <audio controls preload="none">
      <source src="audio/introduction.m4a" type="audio/mp4">
      Your browser does not support this audio.
    </audio>
  </div>

  <div class="buttons">
    <button onclick="showMood('stress')">🌹 When you're stressed</button>
    <button onclick="showMood('anxiety')">💙 When you're anxious</button>
    <button onclick="showMood('miss')">💛 When you miss me</button>
    <button onclick="showMood('cheer')">💚 Before cheer</button>
    <button onclick="showMood('flirty')">💜 In the mood</button>
  </div>

  <footer>Made with all my love ❤️</footer>
</section>

<section id="mood-screen" class="hidden">
  <button class="back" onclick="goHome()">← Back home</button>
  <div class="panel">
    <h2 id="mood-title"></h2>
    <audio id="mood-audio" controls preload="none">
      <source id="mood-source" src="" type="audio/mp4">
      Your browser does not support this audio.
    </audio>
    <p class="message" id="mood-message"></p>
  </div>
</section>

</main>

<script>
const moods = {
  stress: {
    title: "When you're stressed 🌹",
    audio: "audio/when-shes-stressed.m4a",
    message: "My sweet baby girl, remember what I taught you. Breathe and have a listen. And remember, you don't have to do it all at once or alone."
  },
  anxiety: {
    title: "When you're anxious 💙",
    audio: "audio/when-shes-anxious.m4a",
    message: "Baby, no matter the day or the time, just know I'm always here with you. Whatever is worrying you, whether that's you worrying about me or life, just know it will all be okay."
  },
  miss: {
    title: "When you miss me 💛",
    audio: "audio/when-she-misses-me.m4a",
    message: "Baby, if you need a little reminder, I know I'm not always there, but I'm always there in your heart. I'm never going anywhere."
  },
  cheer: {
    title: "Before cheer 💚",
    audio: "audio/before-cheer.m4a",
    message: "My sweet baby girl, need I say more? Go out and perform. Show them how tough my baby is."
  },
  flirty: {
    title: "In the mood 💜",
    audio: "audio/in-the-mood.m4a",
    message: "Baby, don't worry. I might not be there to take care of this, but I'll be able to point you in the right direction from here."
  }
};

const home = document.getElementById("home");
const moodScreen = document.getElementById("mood-screen");
const moodTitle = document.getElementById("mood-title");
const moodMessage = document.getElementById("mood-message");
const moodAudio = document.getElementById("mood-audio");
const moodSource = document.getElementById("mood-source");

function showMood(name) {
  const mood = moods[name];
  if (!mood) return;

  home.classList.add("hidden");
  moodScreen.classList.remove("hidden");

  moodTitle.textContent = mood.title;
  moodMessage.textContent = mood.message;
  moodSource.src = mood.audio;
  moodAudio.load();

  document.body.dataset.mood = name;
  history.pushState({ mood: name }, "");
}

function goHome() {
  moodAudio.pause();
  moodScreen.classList.add("hidden");
  home.classList.remove("hidden");
  document.body.dataset.mood = "home";
  history.pushState({ mood: "home" }, "");
}

window.addEventListener("popstate", (event) => {
  if (event.state && event.state.mood && moods[event.state.mood]) {
    const mood = moods[event.state.mood];
    home.classList.add("hidden");
    moodScreen.classList.remove("hidden");
    moodTitle.textContent = mood.title;
    moodMessage.textContent = mood.message;
    moodSource.src = mood.audio;
    moodAudio.load();
    document.body.dataset.mood = event.state.mood;
  } else {
    moodAudio.pause();
    moodScreen.classList.add("hidden");
    home.classList.remove("hidden");
    document.body.dataset.mood = "home";
  }
});

history.replaceState({ mood: "home" }, "");
</script>
</body>
</html>
